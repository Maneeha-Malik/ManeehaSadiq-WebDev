<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Login - Mini Store</title>
</head>

    <div class="form-container">
        <h2>Login</h2>

    </div>
    <script src="app.js"></script>
</body>
</html>
